<svg style="--soai-animated-logo-ring-edge: #0d0d0d; --soai-animated-logo-ring-mid: #222222; --soai-animated-logo-ring-border: #444444; --soai-animated-logo-dot-fill: #858585; --soai-animated-logo-center-fill: #bedc00; --soai-animated-logo-ring-edge: #e5e5e5; --soai-animated-logo-ring-mid: #ffffff; --soai-animated-logo-ring-border: #b8b8b8;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <style>
